<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BusyTraderApp | AI Trading Tools, PDFs & EAs</title>
  <meta name="description" content="BusyTraderApp provides AI-powered trading tools, scanners, PDFs, Expert Advisors, and resources for disciplined traders." />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #070707 0%, #101010 100%);
      color: #ffffff;
    }

    a { color: inherit; text-decoration: none; }

    .wrapper {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .topbar {
      position: sticky;
      top: 0;
      background: rgba(8,8,8,0.95);
      border-bottom: 1px solid #1d1d1d;
      z-index: 999;
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      padding: 14px 20px;
      align-items: center;
    }

    .brand { color: gold; font-weight: bold; }

    .nav { display: flex; gap: 15px; }

    .nav a:hover { color: gold; }

    .hero {
      text-align: center;
      padding: 80px 0;
    }

    .badge {
      border: 1px solid gold;
      padding: 6px 12px;
      border-radius: 999px;
      color: gold;
    }

    h1 { font-size: 48px; }

    .section {
      padding: 60px 0;
    }

    .section-title {
      text-align: center;
      color: gold;
      font-size: 32px;
    }

    .section-subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 40px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 20px;
    }

    .card, .product-card {
      background: #121212;
      padding: 20px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
    }

    .product-card { height: 100%; }

    .product-card .product-btn,
    .product-card form {
      margin-top: auto;
    }

    .price {
      color: gold;
      font-size: 24px;
      margin: 10px 0;
    }

    .product-btn, .buy-btn {
      background: gold;
      color: #111;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    .product-btn:hover { filter: brightness(1.1); }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #0d0d0d;
      border: 1px solid #333;
      color: #fff;
    }

    .footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">BusyTraderApp</div>
    <div class="nav">
      <a href="#shop">Shop</a>
    </div>
  </div>
</div>

<div class="wrapper">

<section class="hero">
  <div class="badge">AI Trading Tools</div>
  <h1>Trade Smarter</h1>
</section>

<section id="shop" class="section">
  <h2 class="section-title">Products</h2>

  <div class="product-grid">

    <!-- MONTHLY -->
    <div class="product-card">
      <h3>NAS100 EA</h3>
      <div class="price">£49/month</div>
      <a class="product-btn"
         href="https://buy.stripe.com/00w00b0N43k3eBheEEds409"
         target="_blank">
         Subscribe Monthly
      </a>
    </div>

    <!-- ANNUAL -->
    <div class="product-card">
      <h3>NAS100 EA Annual</h3>
      <div class="price">£399/year</div>
      <a class="product-btn"
         href="https://buy.stripe.com/4gM4grgM2dYHfFl400ds40a"
         target="_blank">
         Get Annual Access
      </a>
    </div>

    <!-- PDF -->
    <div class="product-card">
      <h3>Strategy PDF</h3>
      <div class="price">£19</div>
      <a class="product-btn"
         href="https://buy.stripe.com/9B65kvcvMcUD64Laoods40b"
         target="_blank">
         Buy PDF
      </a>
    </div>

    <!-- FREE -->
    <div class="product-card">
      <h3>Free Checklist</h3>
      <div class="price">£0</div>

      <form onsubmit="event.preventDefault(); alert('Captured');">
        <input placeholder="Name" required>
        <input placeholder="Email" required>
        <button class="product-btn">Download</button>
      </form>

    </div>

  </div>
</section>

<div class="footer">
  © BusyTraderApp
</div>

</div>

</body>
</html>
